[project]
name = "clamnp"
version = "0.1.0"
description = "CLaM-NP: natural-product-likeness scoring with SMILES language models"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "kohbanye", email = "kohbanye@gmail.com" }]
keywords = ["cheminformatics", "natural products", "SMILES", "language model", "drug discovery"]
dependencies = [
    "torch>=2.7.1",
    "transformers>=4.55.0",
    "rdkit>=2025.3.5",
    "huggingface-hub>=0.20",
    "numpy>=1.26",
    "tqdm>=4.66",
    "typer>=0.12",
]

[project.optional-dependencies]
# Training the language models (Lightning + logging + dataset prep).
train = [
    "lightning>=2.5.2",
    "wandb>=0.21.1",
    "scikit-learn>=1.7.2",
    "molvs>=0.1.1",
    "requests>=2.32.4",
    "pandas>=2.3.3",
]
# Notebooks and paper-figure generation.
viz = [
    "matplotlib>=3.10.7",
    "seaborn>=0.13.2",
    "umap-learn>=0.5.9.post2",
    "adjusttext>=1.3.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "ipykernel>=6.30.1",
    "tensorboard>=2.20.0",
]

[project.scripts]
clamnp = "clamnp.cli:main"

[project.urls]
Repository = "https://github.com/ohuelab/clamnp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clamnp"]

# Keep the sdist to the importable package + metadata. Without this, hatchling
# sweeps in everything not VCS-ignored (notebooks/, figures/, untracked cluster
# scripts, ...), bloating the distribution to ~100 MB.
[tool.hatch.build.targets.sdist]
only-include = ["clamnp"]

[dependency-groups]
# Installed by default with `uv sync` / `uv run`, so local development keeps the
# full training + serving + viz stack without needing to pass `--extra` flags.
dev = [
    "ruff>=0.12.7",
    "ty>=0.0.1a16",
    "lightning>=2.5.2",
    "wandb>=0.21.1",
    "scikit-learn>=1.7.2",
    "molvs>=0.1.1",
    "requests>=2.32.4",
    "pandas>=2.3.3",
    "matplotlib>=3.10.7",
    "seaborn>=0.13.2",
    "umap-learn>=0.5.9.post2",
    "adjusttext>=1.3.0",
    "openpyxl>=3.1.5",
    "ipykernel>=6.30.1",
    "tensorboard>=2.20.0",
]
