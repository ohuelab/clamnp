name: Publish to PyPI

on:
  release:
    types: [published]

# Uses PyPI Trusted Publishing (OIDC) — no API token/secret required.
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   add a "pending publisher" with
#     PyPI project name: clamnp
#     owner:            ohuelab
#     repository:       clamnp
#     workflow name:    publish.yml
# To release: bump `version` in pyproject.toml, then publish a GitHub Release.
jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build sdist and wheel
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
